org.gradle.jvmargs=-Xmx1536m -Xms256m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -Xss1m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
# Cap the daemon's worker pool. Each worker is a live thread with its own stack and
# JIT/C1 state, and every one of those is *committed* memory on the pagefile.
#
# The real constraint on this box is not the Java heap, it is the system commit limit:
#
#   \Memory\Committed Bytes = 23.32 GB   vs   \Memory\Commit Limit = 26.37 GB
#
# measured with nothing building. R8 needs a ~200 MB contiguous commit and dies with
# "Native memory allocation (mmap) failed to map 203423744 bytes ... G1 virtual space"
# while `AvailPageFile` is 0 MB — even though the Java heap is only ~1.1 GB used inside
# a 2.5 GB cap. Lowering -Xmx alone does NOT help: G1 reserves the full -Xmx up front,
# so a smaller cap only shrinks the reservation, it does not free commit for R8.
# What actually helps is fewer concurrent workers and a smaller metaspace/code cache.
org.gradle.workers.max=2

kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
kotlin.daemon.jvmargs=-Xmx2g

android.useAndroidX=true
android.nonTransitiveRClass=true
# Retain the existing shared Android source-set layout during the Haze 2 migration.
android.builtInKotlin=false
android.newDsl=false
kotlin.mpp.applyDefaultHierarchyTemplate=false
